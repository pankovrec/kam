<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="description" content="">

  <title>Пользователь | Ключевые пользователи</title>

  <!-- Bootstrap core CSS -->
  <link href="assets/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="assets/css/dashboard.css" rel="stylesheet">

  <!-- Just for debugging purposes. Don't actually copy these 2 lines! -->

  <script src="assets/js/ie-emulation-modes-warning.js"></script>

  <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->

      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body>

  <nav class="navbar navbar-inverse navbar-fixed-top">
    <div class="container-fluid">
      <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar"
          aria-expanded="false" aria-controls="navbar">
          <span class="sr-only">Toggle navigation</span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>
        <a class="navbar-brand" href="/">Ключевые пользователи</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-9 col-md-8 col-md-offset-2 main">
        <h1 class="page-header">Пользователь</h1>

        <form method="post" action="/saveuser">
          <div class="form-group">
            <label for="inputName">ID (назначается автоматически)</label>
            <span class="form-control">{{.TargetUser.ID}}</span>
            <input type="hidden" id="inputID" name="id" value="{{.TargetUser.ID}}" />
          </div>

          <div class="form-group">
            <label for="inputSurname">Фамилия</label>
            <input class="form-control" id="inputSurname" name="surname" autocomplete="off" placeholder="введите фамилию"
              value="{{.TargetUser.Surname}}" />
          </div>

          <div class="form-group">
            <label for="inputName">Имя</label>
            <input class="form-control" id="inputName" name="name" autocomplete="off" placeholder="введите имя"
              value="{{.TargetUser.Name}}" />
          </div>

          <div class="form-group">
            <label for="inputPatronymic">Отчество</label>
            <input class="form-control" id="inputPatronymic" name="patronymic" autocomplete="off" placeholder="введите отчество"
              value="{{.TargetUser.Patronymic}}" />
          </div>

          <div class="form-group">
            <label for="inputBirthday">Дата рождения</label>
            <input class="form-control" id="inputBirthdayDate" name="birthday" autocomplete="off" placeholder="DD-MM-YYYY"
              value="{{ .TargetUser.BirthdayDateStr }}" />
          </div>

          <div class="form-group">
            <label for="inputJobtitle">Должность</label>
            <input class="form-control" id="inputJobtitle" name="jobtitle" autocomplete="off" placeholder="введите должность"
              value="{{.TargetUser.Jobtitle}}" />
          </div>

          <button type="submit" class="btn btn-primary">OK</button>

        </form>

      </div>
    </div>
  </div>

  <!-- Bootstrap core JavaScript
    ================================================== -->
  <!-- Placed at the end of the document so the pages load faster -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script src="assets/js/bootstrap.min.js"></script>
  <!-- Just to make our placeholder images work. Don't actually copy the next line! -->
  <script src="assets/js/holder.min.js"></script>
  <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->
  <script src="assets/js/ie10-viewport-bug-workaround.js"></script>
</body>

</html>
